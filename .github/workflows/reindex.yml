
name: Hourly Site Re-indexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsyntax-production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Redirects and Prepare Key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          if [ ! -s public/_redirects ]; then
            echo "::error::public/_redirects is missing or empty."
            exit 1
          fi

          RULE_COUNT=$(grep -cvE '^[[:space:]]*(#.*)?$' public/_redirects || true)

          if [ "$RULE_COUNT" -eq 0 ] || [ "$RULE_COUNT" -gt 2000 ]; then
            echo "::error::Invalid static redirect count: $RULE_COUNT"
            exit 1
          fi

          KEY="7869b6e8c08d4f26897c57a3b9a85011"
          KEY_FILE="${KEY}.txt"

          if [ -f "$KEY_FILE" ]; then
            cp "$KEY_FILE" "public/$KEY_FILE"
          elif [ ! -s "public/$KEY_FILE" ]; then
            echo "::error::IndexNow key file is missing."
            exit 1
          fi

          echo "Redirect rules verified: $RULE_COUNT"

      - name: Generate Sitemap
        run: node build-sitemap.js

      - name: Verify Deployment Files
        shell: bash
        run: |
          set -euo pipefail

          test -s public/sitemap.xml
          test -s public/_redirects
          test -s public/7869b6e8c08d4f26897c57a3b9a85011.txt

          echo "All deployment files verified."

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name=devsyntax \
            --commit-dirty=true

      - name: Run IndexNow Ping
        run: node ping-indexnow.js
